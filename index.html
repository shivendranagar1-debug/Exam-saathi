<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MP SI Pre 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<style id="css">
:root{--bg:#f3f5fb;--surface:#fff;--ink:#14183a;--muted:#5b6188;--line:#d9ddef;--brand:#1a3b9c;--brand-ink:#fff;--mark:#ffd23f;--acc:#ff7a1a;--ok:#0d7a47;--okbg:#dcf5e8;--bad:#b3261e;--badbg:#fde4e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--surface:#181c3a;--ink:#eceefb;--muted:#9aa0cc;--line:#2c3260;--brand:#8c9bff;--brand-ink:#0f1226;--ok:#5fd59b;--okbg:#12382a;--bad:#ff8a80;--badbg:#3d1a19}}
:root[data-theme="dark"]{--bg:#0f1226;--surface:#181c3a;--ink:#eceefb;--muted:#9aa0cc;--line:#2c3260;--brand:#8c9bff;--brand-ink:#0f1226;--ok:#5fd59b;--okbg:#12382a;--bad:#ff8a80;--badbg:#3d1a19}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Mukta",system-ui,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:28px;font-weight:800;margin:8px 0 2px}
h1 span{background:linear-gradient(transparent 55%,var(--mark) 55%);padding:0 4px}
h2{font-size:20px;margin:20px 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:12px 4px;cursor:pointer;border-top:3px solid transparent}
nav button{font-size:15px}
nav button[aria-selected="true"]{color:var(--brand);border-top-color:var(--brand)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.meta{color:var(--muted);font-size:14px;margin-bottom:6px}
.q{font-size:19px;font-weight:600;margin:0 0 12px;white-space:pre-line}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px 14px;margin-bottom:8px;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.exp{border-left:4px solid var(--mark);padding:8px 12px;margin:12px 0;background:var(--bg);border-radius:0 8px 8px 0}
.primary{border:0;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:600;border-radius:10px;padding:12px 20px;cursor:pointer;width:100%}
.primary:disabled{opacity:.45;cursor:default}
.ghost{border:1px solid var(--line);background:none;color:var(--bad);font:inherit;border-radius:8px;padding:4px 10px;cursor:pointer;flex:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pdf a{flex:none;border-radius:8px;padding:8px 14px;font-weight:600;text-decoration:none;background:var(--brand);color:var(--brand-ink)}
.pdf h3,.ca h3{margin:0 0 2px;font-size:18px}
.tag{display:inline-block;background:var(--mark);color:#14183a;border-radius:6px;padding:0 8px;font-size:13px;font-weight:600;margin-right:6px}
.score{font-size:44px;font-weight:800;margin:4px 0}
.note{color:var(--muted);font-size:14px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
textarea{min-height:120px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:4}
.msg{color:var(--bad);font-size:15px;margin:4px 0 8px}
[hidden]{display:none!important}
nav button{font-size:12px;padding:8px 2px}nav button b{display:block;font-size:20px;font-weight:400}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}.hd h1{margin:0;font-size:22px;letter-spacing:.04em;color:var(--brand)}.hd h1 span{background:none;padding:0;color:var(--acc)}.hd .tg{font-size:12px;color:var(--muted)}
.lg{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#1a3b9c,#3560e0);display:grid;place-items:center;font-size:24px;flex:none}
.ib{margin-left:auto;display:flex;gap:6px}.ib button{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}
.hero{background:linear-gradient(135deg,#12308a,#3560e0);color:#fff;border-radius:20px;padding:20px;position:relative;overflow:hidden;margin:14px 0}
.hero h2{margin:0 0 4px;font-size:22px;max-width:70%}.hero p{margin:0 0 14px;max-width:65%;opacity:.9}.hero .ic{position:absolute;right:12px;bottom:4px;font-size:78px}
.bo{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
.srch input{margin:0;border-radius:999px;padding:12px 18px;box-shadow:0 2px 10px rgba(26,59,156,.1)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa,.ex,.st{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(26,59,156,.08);color:var(--ink);font:inherit;text-align:center}
.qa{padding:12px 2px;font-size:13px;cursor:pointer}.qa b,.ex b{display:block;font-size:26px;font-weight:400}
.ex{padding:12px;text-align:left}.ex button{margin-top:6px;border:1px solid var(--acc);color:var(--acc);background:none;border-radius:999px;padding:2px 14px;font:inherit;cursor:pointer}
.sb{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 4px;font:inherit;font-size:14px;cursor:pointer}.sb b{display:block;font-size:22px;font-weight:400}
.chal{background:linear-gradient(135deg,#ff7a1a,#ffa24d);color:#fff;border-radius:18px;padding:16px;margin-top:14px}.chal h3,.prem h3{margin:0 0 2px;font-size:19px}.chal button{background:#fff;color:#b44a00;border:0;border-radius:999px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}
.st{padding:10px 4px}.st b{display:block;font-size:24px;color:var(--brand)}.st span{font-size:12px;color:var(--muted)}
.prem{background:linear-gradient(135deg,#0c1d5a,#1a3b9c);color:#fff;border-radius:18px;padding:16px;margin-top:14px}.prem ul{margin:8px 0;padding-left:18px}.prem .soon{display:inline-block;background:var(--acc);border-radius:999px;padding:4px 14px;font-weight:700}
:root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#555;--line:#cfcfcf;--brand:#000;--brand-ink:#fff;--acc:#000;--mark:#000;--ok:#000;--okbg:#000;--bad:#000;--badbg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:#000;--ink:#fff;--muted:#aaa;--line:#444;--brand:#fff;--brand-ink:#000;--acc:#fff;--mark:#fff;--ok:#fff;--okbg:#fff;--bad:#fff;--badbg:#000}}
:root[data-theme="dark"]{--bg:#000;--surface:#000;--ink:#fff;--muted:#aaa;--line:#444;--brand:#fff;--brand-ink:#000;--acc:#fff;--mark:#fff;--ok:#fff;--okbg:#fff;--bad:#fff;--badbg:#000}
:root[data-theme="light"]{--bg:#fff;--surface:#fff;--ink:#000;--muted:#555;--line:#cfcfcf;--brand:#000;--brand-ink:#fff;--acc:#000;--mark:#000;--ok:#000;--okbg:#000;--bad:#000;--badbg:#fff}
h1 span{background:none;padding:0;color:var(--ink)}
.opt.ok{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.opt.bad{border:1.5px dashed var(--ink);background:var(--bg);color:var(--ink);text-decoration:line-through}
.tag{background:var(--ink);color:var(--bg)}.exp{border-left-color:var(--ink)}
.card,.st{box-shadow:none}nav button b{font-size:18px}details{margin-top:8px}
.hero2{background:var(--ink);color:var(--bg);border-radius:22px;padding:22px;margin-bottom:16px}
.hc{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:2px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:18px;padding:16px;margin-bottom:12px;font:inherit;cursor:pointer}
.hc svg{width:56px;height:56px;flex:none}.hc b{font-size:19px}.hc .arr{margin-left:auto;font-size:22px}
</style>
<script>
(function(){
function show(m){var r=document.getElementById("root")||document.body;if(r.children.length&&r.id==="root")return;r.innerHTML='<pre style="margin:16px;padding:14px;background:#fff;color:#000;border:3px solid #000;white-space:pre-wrap;font:14px/1.5 monospace">फाइल अधूरी या खराब चढ़ी है। नई index.html को "Upload files" से फिर चढ़ाएँ।\n\n'+m+'</pre>'}
window.addEventListener("error",function(e){show("Error: "+(e.message||"")+" (line "+e.lineno+")")});
setTimeout(function(){var r=document.getElementById("root");if(!r||!r.children.length)show("App शुरू नहीं हुआ (फाइल कटी हुई लगती है)।")},1500);
})();
</script>
</head>

async function loadPdfJs(){
  if(window.pdfjsLib)return window.pdfjsLib;
  await new Promise((ok,no)=>{const e=document.createElement("script");e.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";e.onload=ok;e.onerror=no;document.head.appendChild(e)});
  window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const uniq=a=>[...new Set(a)];
const safeUrl=u=>/^(https?:\/\/|\/_blob\/)/.test(u)?u:"";

function startQ(){pool=D.q.filter(x=>(subj==="Sab"||x.s===subj));qi=0;score=0;ans=null}
function startX(){pool=D.q.filter(x=>x.x===exam&&(esub==="Sab"||x.s===esub));qi=0;score=0;ans=null}
function chips(list,cur,a){return '<div class="chips">'+["Sab",...list].map(x=>'<button class="chip" data-act="'+a+'" data-v="'+esc(x)+'" aria-pressed="'+(x===cur)+'">'+esc(x)+'</button>').join("")+'</div>'}

function vQ(ex){

  x.o.forEach((t,k)=>{const c=ans===null?"":k===x.a?" ok":k===ans?" bad":"";h+='<button class="opt'+c+'" data-act="pick" data-v="'+k+'"'+(ans!==null?" disabled":"")+'>'+esc(t)+'</button>'});
  if(ans!==null)h+='<div class="exp"><strong>'+(ans===x.a?"Sahi jawab":"Galat jawab")+'.</strong> '+esc(x.e||"")+'</div>'+(x.m?'<div class="exp" style="white-space:pre-line">'+esc(x.m)+'</div>':'')+'<button class="primary" data-act="next">'+(qi+1<pool.length?"Agla sawal":"Natija dekhein")+'</button>';
  return h+'</div>';
}
function vX(){
  const ex=uniq(D.q.filter(x=>x.x).map(x=>x.x));
  if(!ex.length)return '<div class="card">Abhi koi pariksha nahi hai. Jald aayegi.</div>';
  if(!exam)return (xn?'<div class="card">'+esc(xn)+' ke sawal jald aayenge.</div>':'')+'<h2>Pariksha chunein</h2>'+ex.map(e=>{const l=D.q.filter(x=>x.x===e);return '<button class="opt" data-act="exam" data-v="'+esc(e)+'"><strong>'+esc(e)+'</strong><br><span class="note">'+l.length+' sawal &middot; '+uniq(l.map(x=>x.s)).length+' subject</span></button>'}).join("");
  const ql=D.q.filter(x=>x.x===exam),subs=uniq(ql.map(x=>x.s));
  let h='<button class="chip" data-act="exam" data-v="">&larr; Sabhi pariksha</button><h2>'+esc(exam)+'</h2>';

  return h+'<button class="chip" data-act="esub" data-v="">&larr; Subject badlein</button> <span class="meta">'+(esub==="Sab"?"Poora paper":esc(esub))+'</span>'+(mode==="sol"?vSol(D.q.filter(x=>x.x===exam&&(esub==="Sab"||x.s===esub))):vQ(true));
}
function vP(){
  let h=chips(uniq(D.p.map(x=>x.s)),psubj,"psubj");
  const l=D.p.filter(x=>psubj==="Sab"||x.s===psubj);
  if(!l.length)return h+'<div class="card">Abhi koi PDF nahi hai. Jald aayengi.</div>';

}
function vC(){
  if(!D.c.length)return '<div class="card">Aaj ki current affairs jald aayengi.</div>';
  return D.c.map(x=>'<div class="card ca"><div class="meta"><span class="tag">'+esc(x.k)+'</span>'+esc(x.d)+'</div><h3>'+esc(x.t)+'</h3><p style="margin:6px 0 0;white-space:pre-line">'+esc(x.b)+'</p></div>').join("");
}
function vA(){
  let h='<div class="bar"><button class="primary" data-act="pub"'+(dirty?"":" disabled")+'>Badlav publish karein</button></div>';
  if(msg)h+='<div class="msg">'+esc(msg)+'</div>';
  h+='<h2>Naye sawal (bulk)</h2><p class="note">Har line mein ek sawal: Sawal | Option A | Option B | Option C | Option D | Sahi option (1-4) | Explanation. Subject pehli line mein "#Polity" likhkar chunein.</p><input id="bx" placeholder="Pariksha ka naam (jaise MPPSC 2026 Prelims). Khali chhodein to normal abhyas mein jayega"><textarea id="bulk" placeholder="#Polity&#10;Bharat ka pehla Rashtrapati kaun tha? | Rajendra Prasad | Nehru | Radhakrishnan | Patel | 1 | Dr. Rajendra Prasad pehle Rashtrapati the."></textarea><button class="primary" data-act="addq">Sawal jodein</button>';
  h+='<h2>PDF se sawal nikaalein</h2><p class="note">Latest exam ki PDF chunein. AI usme se MCQ nikaalega, aap jaanch kar jodein. Scanned (photo wali) PDF mein text nahi hota, wo kaam nahi karegi.</p><input id="xf" type="file" accept="application/pdf"><input id="xe" placeholder="Pariksha ka naam (jaise MPPSC 2026 Prelims)"><input id="xs" placeholder="Subject, ya kai subject comma se alag (khali chhodein to AI tay karega)"><button class="primary" data-act="xrun">Sawal nikaalein</button>';
  if(ext.length){h+='<div class="meta" style="margin-top:12px">'+ext.length+' sawal mile. Jawab zaroor jaanchein, phir jodein.</div>'+ext.map((x,i)=>'<div class="card"><label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" style="width:auto;margin:6px 0 0" data-act="xt" data-i="'+i+'"'+(x.on?" checked":"")+'><span><div class="meta">'+esc(x.s)+'</div>'+esc(x.q)+'<br><span class="note">'+x.o.map((t,k)=>(k===x.a?"\u2713 ":"")+esc(t)).join(" &middot; ")+'</span><br><span class="note">'+esc(x.e)+'</span></span></label></div>').join("")+'<button class="primary" data-act="xadd">Chune hue sawal jodein</button>';}
  h+='<h2>Nayi PDF</h2><input id="pt" placeholder="PDF ka naam"><input id="ps" placeholder="Subject (jaise Polity)"><input id="pd" placeholder="Chhota vivaran"><input id="pu" placeholder="PDF ka link (ya neeche se file chunein)"><input id="pf" type="file" accept="application/pdf"><button class="primary" data-act="addp">PDF jodein</button>';
  h+='<h2>Nayi current affairs</h2><input id="ck" placeholder="Category (National, Economy...)"><input id="ct" placeholder="Headline"><textarea id="cb" placeholder="Saransh (2-3 line)"></textarea><button class="primary" data-act="addc">Jodein</button>';
  h+='<h2>Maujooda content</h2>';
  h+=D.q.map((x,i)=>'<div class="card row"><div><div class="meta">Sawal &middot; '+esc(x.s)+'</div>'+esc(x.q)+'</div><button class="ghost" data-act="del" data-k="q" data-i="'+i+'">Hatayein</button></div>').join("");
  h+=D.p.map((x,i)=>'<div class="card row"><div><div class="meta">PDF</div>'+esc(x.t)+'</div><button class="ghost" data-act="del" data-k="p" data-i="'+i+'">Hatayein</button></div>').join("");
  h+=D.c.map((x,i)=>'<div class="card row"><div><div class="meta">Current affairs</div>'+esc(x.t)+'</div><button class="ghost" data-act="del" data-k="c" data-i="'+i+'">Hatayein</button></div>').join("");
  return h;
}
function render(){
  const tabs=[["m","<b>⌂</b>Home"],["h","<b>▤</b>Paper Solution"],["c","<b>◔</b>Current Affairs"],["q","<b>✎</b>Practice"]];
  const v={m:vM,h:vH,u:vU,r:vR,s:vSs,q:vQ,x:()=>tog()+vX(),p:vP,c:vC,a:vA}[tab]();
  $("#root").innerHTML='<div class="wrap"><div class="row" style="margin-bottom:10px"><strong style="letter-spacing:.14em;font-size:13px">MP SI PRE 2026</strong><span><button class="chip" data-act="theme" aria-label="Light/Dark">◐</button>'+(admin?' <button class="chip" data-act="go" data-v="a">Admin</button>':'')+'</span></div>'+(function(t){return t?'<h1 style="margin:0 0 12px;font-size:28px">'+t+'</h1>':""})({c:"Current Affairs",q:"Practice",a:"Admin"}[tab])+v+'</div><nav role="tablist">'+tabs.map(t=>'<button role="tab" data-act="tab" data-v="'+t[0]+'" aria-selected="'+(t[0]===tab)+'">'+t[1]+'</button>').join("")+'</nav>';
}
const val=id=>($("#"+id)||{value:""}).value.trim();
const act={
  tab(d){tab=d.v;msg="";xn="";if(d.v==="q")startQ();if(d.v==="x"){exam=null;esub=null}window.scrollTo(0,0);render()},
  subj(d){subj=d.v;startQ();render()},
  psubj(d){psubj=d.v;render()},
  pick(d){if(ans!==null)return;ans=+d.v;if(ans===pool[qi].a)score++;rec(ans===pool[qi].a);render()},
  next(){qi++;ans=null;if(qi>=pool.length)fin();render()},
  again(){(tab==="x"?startX:tab==="q"?startQ:()=>{qi=0;score=0;ans=null})();render()},
  go(d){act.tab(d)},
  att(d){const k=+d.k,v=+d.v;if(att[k]!==undefined)return;att[k]=v;if(v>=0)rec(v===D.q[k].a);const y=window.scrollY;render();window.scrollTo(0,y)},
  rstAtt(){att={};render()},
  mode(d){mode=d.v;if(mode==="quiz"&&tab==="x"&&esub)startX();render()},
  hs(d){show(d.v,D.q.filter(x=>x.x&&x.s===d.v));window.scrollTo(0,0);render()},
  he(d){show(d.v,D.q.filter(x=>x.x===d.v));window.scrollTo(0,0);render()},
  hall(){show("सभी सवाल",D.q.filter(x=>x.x));window.scrollTo(0,0);render()},
  daily(){mk("Today\u2019s Challenge",[...D.q].sort(()=>Math.random()-.5).slice(0,10));render()},
  sub(d){const k=SUBJ[+d.i];mk(k[1]+" Practice",D.q.filter(x=>k[3].some(w=>x.s.includes(w))));render()},
  search(){const t=val("sq").toLowerCase();if(!t)return;show("खोज: "+val("sq"),D.q.filter(x=>x.x&&(x.q+" "+x.s+" "+x.x+" "+x.o.join(" ")+" "+(x.e||"")).toLowerCase().includes(t)));render()},
  ex(d){const n=d.v.toLowerCase().replace(/\s/g,""),f=uniq(D.q.filter(x=>x.x).map(x=>x.x)).find(e=>e.toLowerCase().replace(/\s/g,"").includes(n));tab="x";esub=null;exam=f||null;xn=f?"":d.v;window.scrollTo(0,0);render()},
  theme(){const r=document.documentElement,dk=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=dk?"light":"dark"},
  rst(){svS({t:0,sv:0,ok:0,st:0,last:""});render()},
  exam(d){exam=d.v||null;esub=null;render()},
  esub(d){esub=d.v||null;if(esub)startX();render()},
  del(d){D[d.k].splice(+d.i,1);dirty=true;render()},
  xt(d){ext[+d.i].on=!ext[+d.i].on;render()},
  xadd(){const r=ext.filter(x=>x.on).map(({on,...z})=>z);(r.length&&r[0].x?D.q.push(...r):D.q.unshift(...r));ext=[];dirty=dirty||r.length>0;msg=r.length+" sawal jude.";render()},
  async xrun(){
    const f=$("#xf").files[0],hint=val("xs"),xe=val("xe");
    if(!f){msg="Pehle PDF file chunein.";return render()}
    const sm=await claude.use("sample");
    if(!sm){msg="AI se sawal nikaalna abhi uplabdh nahi hai.";return render()}
    try{
      msg="PDF padh rahe hain...";render();
      const lib=await loadPdfJs();
      const pdf=await lib.getDocument({data:await f.arrayBuffer()}).promise;
      let all="";
      for(let n=1;n<=pdf.numPages;n++){const t=await (await pdf.getPage(n)).getTextContent();all+=t.items.map(i=>i.str).join(" ")+"\n"}
      if(all.replace(/\s/g,"").length<200){msg="Is PDF mein text nahi mila (shayad scanned hai).";return render()}
      const chunks=[];for(let i=0;i<all.length&&chunks.length<20;i+=5500)chunks.push(all.slice(i,i+6000));
      const seen=new Set(),out=[];
      for(let k=0;k<chunks.length;k++){
        msg="Sawal nikal rahe hain... ("+(k+1)+"/"+chunks.length+")";render();
        const r=await sm.json("Extract every complete multiple-choice question from the exam text below. Keep the original language (Hindi stays Hindi). Return ONLY a JSON array of objects {\"s\":subject,\"q\":question,\"o\":[exactly 4 options without labels],\"a\":index 0-3 of the correct option,\"e\":one-line explanation}. If the text has an answer key, use it; otherwise solve it yourself and start e with \"(AI anuman) \". Skip questions that are cut off or have fewer than 4 options. "+(hint.includes(",")?"Subject must be exactly one of: "+hint+". ":hint?"Subject: "+hint+". ":"Infer the subject using consistent standard subject names. ")+"If there are none, return [].\n\nTEXT:\n"+chunks[k]);
        (Array.isArray(r)?r:[]).forEach(x=>{
          if(!x||typeof x.q!=="string"||!Array.isArray(x.o)||x.o.length!==4||!(x.a>=0&&x.a<=3))return;
          const key=x.q.replace(/\s/g,"");if(seen.has(key))return;seen.add(key);
          out.push({s:String(x.s||hint||"General"),q:x.q,o:x.o.map(String),a:x.a|0,e:String(x.e||""),x:xe||undefined,on:true});
        });
      }
      ext=out;msg=out.length?"":"Koi MCQ sawal nahi mila.";
    }catch(e){msg="Sawal nahi nikal paaye: "+((e&&(e.message||e.code))||"error");}
    render();
  },
  addq(){
    let s="General",n=0,bad=0;const ex=val("bx");
    val("bulk").split("\n").forEach(l=>{
      l=l.trim();if(!l)return;
      if(l[0]==="#"){s=l.slice(1).trim()||s;return}
      const p=l.split("|").map(x=>x.trim());const a=parseInt(p[5],10);
      if(p.length<6||p.slice(1,5).some(x=>!x)||!(a>=1&&a<=4)){bad++;return}
      const it={s:s,q:p[0],o:p.slice(1,5),a:a-1,e:p[6]||""};if(ex){it.x=ex;D.q.push(it)}else D.q.unshift(it);n++;
    });
    dirty=dirty||n>0;msg=n+" sawal jude"+(bad?", "+bad+" line galat format mein thi.":".");render();
  },
  async addp(){
    const t=val("pt");let u=safeUrl(val("pu"));const f=$("#pf").files[0];
    if(!t){msg="PDF ka naam likhein.";return render()}
    if(f){const as=await claude.use("assets");if(!as){msg="File upload abhi uplabdh nahi hai, link use karein.";return render()}
      try{u=(await as.upload(f)).url}catch(e){msg="Upload nahi hua: "+(e.message||e.code);return render()}}
    if(!u){msg="PDF ka sahi link ya file dein.";return render()}
    D.p.unshift({t:t,s:val("ps")||"General",d:val("pd"),u:u});dirty=true;msg="PDF jud gayi.";render();
  },
  addc(){
    if(!val("ct")){msg="Headline likhein.";return render()}
    D.c.unshift({k:val("ck")||"General",t:val("ct"),b:val("cb"),d:new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})});
    dirty=true;msg="Current affairs jud gayi.";render();
  },
  async pub(){
    const a=await claude.use("artifact");
    if(!a){msg="Publish ki anumati nahi mili.";return render()}
    const json=JSON.stringify(D).replace(/</g,"\\u003c");
    const html='<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MP SI Pre 2026</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap"><style id="css">'+$("#css").textContent+'</style></head><body><div id="root"></div><script id="data" type="application/json">'+json+'<\/script><script id="app">'+$("#app").textContent+'<\/script></body></html>';
    try{await a.publish(html)}catch(e){if(e&&e.code!=="conflict"){msg="Publish nahi hua: "+(e.message||e.code);render()}}
  }
};
$("#root").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b&&act[b.dataset.act])act[b.dataset.act](b.dataset)});
startQ();render();$("#root").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="sq")act.search()});
(window.claude?claude.use("user"):Promise.resolve(null)).then(u=>{if(u&&u.canEdit&&u.canEdit()){admin=true;render()}}).catch(()=>{});
